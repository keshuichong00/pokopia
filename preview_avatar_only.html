<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作者头像布局示意图</title>
<style>
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#eceff3; color:#2c2138; }
  h1 { font-size:18px; padding:16px 20px 4px; margin:0; }
  .sub { font-size:13px; color:#6b6275; padding:0 20px 14px; }
  .wrap { display:flex; gap:18px; flex-wrap:wrap; padding:0 20px 28px; }
  .card { background:#fff; border-radius:12px; padding:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .card h2 { font-size:14px; margin:0 0 10px; }
  .card .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; margin-left:6px; }
  .tag.new { background:#e8f5e9; color:#2e7d32; }
  .tag.cur { background:#fdecea; color:#c0392b; }
  .note { font-size:12px; color:#6b6275; margin-top:8px; line-height:1.6; }
</style>
</head>
<body>
<h1>作者头像布局示意图</h1>
<div class="sub">左 = 当前线上版（头像在橙色块内左侧 + 名字在右）　|　右 = 改后示意（头像单独出现，无橙色底框、无名字）</div>
<div class="wrap">
  <div class="card">
    <h2>当前线上版 <span class="tag cur">保留参考</span></h2>
    <canvas id="cur" width="640" height="300"></canvas>
    <div class="note">橙色圆角块（#ff8a3d）同时包住圆头像(100px)与 @名字(40px白)，块高 116px，距底 20px。</div>
  </div>
  <div class="card">
    <h2>改后示意 <span class="tag new">待确认</span></h2>
    <canvas id="new" width="640" height="300"></canvas>
    <div class="note">圆头像(100px)单独出现在左下角（无橙色框）；其右侧紧挨一个<b>独立橙色圆角块（#ff8a3d）+ @名字(40px白字)</b>。头像与名字块垂直居中对齐，整体距底 20px。页码仍在底部居中。</div>
  </div>
</div>

<script>
const PAGE_W = 1600, PAGE_BG = '#fdf7f7', PAD_X = 70, AV = 100;
function bg(c){ c.fillStyle = PAGE_BG; c.fillRect(0,0,640,300); }

// 画一个占位头像（渐变圆 + 人形剪影）
function drawPlaceholderAvatar(c, x, y, d){
  c.save();
  c.beginPath(); c.arc(x+d/2, y+d/2, d/2, 0, Math.PI*2); c.clip();
  const g = c.createLinearGradient(x,y,x,y+d); g.addColorStop(0,'#b39ddb'); g.addColorStop(1,'#7c5fb6');
  c.fillStyle = g; c.fillRect(x,y,d,d);
  // 人形
  c.fillStyle = 'rgba(255,255,255,.92)';
  c.beginPath(); c.arc(x+d/2, y+d*0.40, d*0.18, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(x+d/2, y+d*0.78, d*0.30, d*0.24, 0, 0, Math.PI*2); c.fill();
  c.restore();
}

// 真实图片占位：用占位头像即可（演示布局）
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

// === 当前版 ===
(function(){
  const cv = document.getElementById('cur'); const c = cv.getContext('2d');
  bg(c);
  const authorText = '@瞌睡虫';
  c.font = 'bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
  const tw = c.measureText(authorText).width;
  const bh = 116, bw = 8 + AV + 24 + tw + 20;
  const bx = PAD_X, by = 300 - bh - 20;
  c.fillStyle = '#ff8a3d'; roundRect(c, bx, by, bw, bh, 14); c.fill();
  const ax = bx+8, ay = by + (bh-AV)/2;
  drawPlaceholderAvatar(c, ax, ay, AV);
  c.fillStyle = '#fff'; c.textAlign='left'; c.textBaseline='middle';
  c.fillText(authorText, ax+AV+24, by+bh/2+1);
})();

// === 改后版：头像单独（无框）+ 名字独立橙色块在旁 ===
(function(){
  const cv = document.getElementById('new'); const c = cv.getContext('2d');
  bg(c);
  const d = AV;                                   // 头像直径 100
  const ax = PAD_X, ay = 300 - d - 20;            // 头像距底 20px，距左 70px
  drawPlaceholderAvatar(c, ax, ay, d);
  // 名字独立橙色块（白字），在头像右侧
  const authorText = '@瞌睡虫';
  c.font = 'bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
  const tw = c.measureText(authorText).width;
  const bh2 = 56, bw2 = tw + 56, gap = 20;
  const bx2 = ax + d + gap;
  const by2 = ay + (d - bh2) / 2;                  // 与头像垂直居中对齐
  c.fillStyle = '#ff8a3d'; roundRect(c, bx2, by2, bw2, bh2, 14); c.fill();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(authorText, bx2 + bw2/2, by2 + bh2/2 + 1);
  // 底部居中页码（白色 26px）
  c.fillStyle = '#ffffff'; c.font = '26px "PingFang SC","Microsoft YaHei",sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('第 1 / 共 1 页', 320, 300 - 25);
})();
</script>
</body>
</html>
